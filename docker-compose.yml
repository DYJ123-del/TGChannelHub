services:
  tgchannelhub:
    build: .
    image: tgchannelhub:latest
    container_name: tgchannelhub
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      - ./data:/app/data
    environment:
      - TZ=Asia/Shanghai
      # Telegram API 凭证（必填，改你的）
      - TG_API_ID=1234567
      - TG_API_HASH=abcdef0123456789abcdef0123456789
      - PORT=8081
      - HOST=0.0.0.0
      # 公网地址：反代后改成 https://你的域名，分享链接用它生成
      - PUBLIC_URL=http://192.168.1.100:8081
      # 密码（部署后立刻改）
      - TG_UI_PASSWORD=change-me-share
      - TG_ADMIN_PASSWORD=change-me-admin
      - TG_SESSION_NAME=/app/data/tgchannelhub
      # 代理（可选；直连 TG 超时/受限才需要，取消注释并填写）
      # - TG_PROXY_HOST=192.168.1.2
      # - TG_PROXY_PORT=7890
      # - TG_PROXY_USER=user
      # - TG_PROXY_PASS=pass
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s